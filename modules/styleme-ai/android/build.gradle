buildscript {
  repositories {
    mavenCentral()
  }
}

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.stylemeai'
version = '0.1.0'

android {
  namespace "expo.modules.stylemeai"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Gemini Nano via AICore — on-device Prompt API (requires Android 8.0+).
  implementation 'com.google.mlkit:genai-prompt:1.0.0-beta4'
}
