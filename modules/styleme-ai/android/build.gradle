buildscript {
  repositories {
    mavenCentral()
  }
}

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.stylemeai'
version = '0.1.0'

android {
  namespace "expo.modules.stylemeai"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}
